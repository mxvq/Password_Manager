<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort bearbeiten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>✏️ Accountdetails bearbeiten</h1>
        <p>Ändere die Details des gespeicherten Accounts.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <label for="site">🔗 Seite / App:</label><br>
            <input type="text" id="site" name="site" value="{{site}}" required><br><br>

            <label for="site">📧 E-Mail:</label><br>
            <input type="text" id="email" name="email" value="{{email}}" required><br><br>

            <label for="username">👤 Benutzername:</label><br>
            <input type="text" id="username" name="username" value="{{username}}" required><br><br>

            <label for="password">🔒 Passwort:</label><br>
            <input type="text" id="password" name="password" value="{{password}}" required oninput="checkStrength(this.value)"><br><br>
            <button type="button" onclick="generatePassword()">🔁Generieren
            </button>
                        <div id="strengthBar" style="height: 5px; width: 100%; background-color: #eee; margin-top: 5px;">
                <div id="strengthLevel" style="height: 100%; width: 0%; background-color: red;"></div>
            </div>
            <p id="strengthText" style="font-size: 0.9em; text-align: left; margin-top: 4px;">Passwortstärke: </p>

            <button type="submit">💾 Änderungen Speichern</button>
        </form>

        <a href="{{ url_for('vault') }}" class="login-link">Zurück zum Tresor</a>
    </div>
<script src="{{ url_for('static', filename='js/password_strength.js') }}"></script>
<script src="{{ url_for('static', filename='js/generatePassword.js') }}"></script>
</body>
</html>
