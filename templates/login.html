<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🔑 Login</h1>
        <p>Bitte melde dich an, um deinen Account-Tresor zu öffnen.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <input name="username" placeholder="Benutzername oder E-Mail" required>
            <input name="password" type="password" placeholder="Passwort" required>
            <p style="margin-top: 4px; font-size: 0.9em; text-align: left">
            <a href="{{ url_for('reset_request') }}">Passwort vergessen?</a>
            <button type="submit">Einloggen</button>
        </form>

        <a href="{{ url_for('register') }}" class="login-link">Noch kein Konto? → Registrieren</a>
    </div>
</body>
</html>
