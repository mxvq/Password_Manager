<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrieren</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="table-container">
        <h2>🔐 Account Tresor von {{ session['username'] }}</h2>
        <div style = "overflow-x: auto;">
        <table>
            <tr>
                <th>Seite / App</th>
                <th>E-Mail</th>
                <th>Benutzername</th>
                <th>Passwort</th>
                <th>Aktionen</th>
            </tr>
            {% for acc in user_accounts %}
            <tr>
                <td>{{acc.site}}</td>
                <td>{{acc.email}}</td>
                <td>{{acc.username}}</td>
                <td>
                    <div style="display: inline-flex; align-items: center;">
                    <span id="pw-{{ acc.id }}">{{ acc.password }}</span>
                    <button class ="copy-button" onclick="copyToClipboard('pw-{{ acc.id }}', 'copied-{{ acc.id }}')" title="Passwort kopieren">📋</button>
                        <span id="copied-{{ acc.id }}" class="copy-feedback">✔️ Kopiert!</span>
                    </div>
                </td>
                <td><a href="{{ url_for('edit_account_details', id=acc.id) }}"> ✏️ bearbeiten</a> |
                    <a href="{{ url_for('delete_account_details', id=acc.id) }}">❌ löschen</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        </div>
        <p><a href="{{ url_for('add_account_details') }}">➕ Neue Accountdaten hinzufügen</a> | <a href="{{ url_for('logout') }}">🚪 Ausloggen</a></p>
    </div>
<script src="{{ url_for('static', filename='js/copyToClipboard.js') }}"></script>
</body>
</html>
