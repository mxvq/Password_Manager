<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrieren</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="table-container">
        <h2>🔐 Account Tresor von {{ session['username'] }}</h2>
        <div style = "overflow-x: auto;">
        <table>
            <tr>
                <th>Seite / App</th>
                <th>Benutzername</th>
                <th>Passwort</th>
                <th>Aktionen</th>
            </tr>
            {% for acc in user_accounts %}
            <tr>
                <td>{{ acc.site }}</td>
                <td>{{ acc.username }}</td>
                <td>{{ acc.password }}</td>
                <td><a href="{{ url_for('edit_account_details', id=acc.id) }}"> ✏️ bearbeiten</a> |
                    <a href="{{ url_for('delete_account_details', id=acc.id) }}"
                        onclick="return confirm('❗Willst du diesen Account wirklich löschen?');">❌ löschen</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        </div>
        <p><a href="{{ url_for('add_account_details') }}">➕ Neue Accountdaten hinzufügen</a> | <a href="{{ url_for('logout') }}">🚪 Ausloggen</a></p>
    </div>
</body>
</html>
