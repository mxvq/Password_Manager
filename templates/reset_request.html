<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>🔑 Passwort vergessen?</h2>
        <p>Gib deine E-Mail oder deinen Benutzernamen ein, um dein Passwort zurückzusetzen.</p>
        {% if message %}<p style="color: green;">{{ message }}</p>{% endif %}
        {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
<form method="POST">
  <input type="email" name="email" placeholder="E-Mail" required><br><br>
  <button type="submit">Zurücksetzen</button>
</form>
          <p><a href="{{ url_for('login') }}">🔙 Zurück zum Login</a></p>
        </form>
    </div>
</body>
</html>
